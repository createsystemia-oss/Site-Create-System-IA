      '<div class="list" id="' + id + '-lista"></div></section>' +
      (cfg.imagens ? '' : '<section class="panel"><h2>Como agendar a semana inteira no Meta Business Suite</h2><p class="note">Gratuito, para Instagram e Facebook. Os nomes dos menus podem mudar com o tempo.</p><ol class="steps"><li>Acesse o Meta Business Suite pelo navegador ou pelo aplicativo, com a conta da página do Facebook e do Instagram da sua divulgação.</li><li>Toque em Criar publicação e escolha onde publicar: Instagram, Facebook ou os dois.</li><li>Cole o texto copiado aqui e adicione uma imagem. Você pode usar as telas de demonstração da agenda ou uma foto da sua barbearia.</li><li>Em vez de Publicar, escolha Agendar e marque a data e o horário.</li><li>Repita para os próximos dias da semana e marque os dias aqui como agendados.</li></ol><p class="note">Publique no ritmo que fizer sentido, por exemplo um post por dia. Muitos posts seguidos pioram o alcance e podem levar a restrições na conta.</p></section>') +
      (cfg.imagens ? '<section class="panel"><h2>Como publicar com imagem</h2><ol class="steps"><li>Toque em Baixar imagem no dia que você vai publicar.</li><li>Toque em Copiar texto.</li><li>No Meta Business Suite, escolha Criar publicação, anexe a imagem baixada e cole o texto.</li><li>Escolha Agendar, marque data e horário e confirme.</li></ol><p class="note">As imagens são artes gráficas geradas aqui mesmo, no padrão verde e azul da Create System IA. Você também pode trocar por uma foto real da sua barbearia quando tiver uma boa.</p></section>' : '') +
      '</div>';
    function aviso(t) { var m = q("msg"); m.textContent = t; clearTimeout(aviso.t); aviso.t = setTimeout(function () { m.textContent = ""; }, 2600); }

      var t = textoDe(P, atual); q("texto").textContent = t;
